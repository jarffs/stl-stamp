<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG to STL/3MF Stamp Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/examples/js/exporters/STLExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/examples/js/exporters/3MFExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/examples/js/loaders/SVGLoader.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    canvas { display: block; }
    #controls {
      position: fixed;
      top: 10px; left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    button, input[type="file"] {
      margin-top: 6px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button {
      background: #0077ff;
      color: white;
    }
    button:hover {
      background: #005dcc;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="file" id="upload" accept=".svg"><br>
    <button id="downloadSTL">Download STL</button>
    <button id="download3MF">Download 3MF</button>
  </div>
  <script>
    let scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    let light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);

    let object3D;

    document.getElementById('upload').addEventListener('change', (e) => {
      let file = e.target.files[0];
      let reader = new FileReader();
      reader.onload = (event) => {
        let svgText = event.target.result;
        let loader = new THREE.SVGLoader();
        let paths = loader.parse(svgText).paths;
        
        let group = new THREE.Group();
        paths.forEach(path => {
          let shapes = path.toShapes(true);
          shapes.forEach(shape => {
            let geometry = new THREE.ExtrudeGeometry(shape, { depth: 2, bevelEnabled: false });
            let material = new THREE.MeshPhongMaterial({ color: 0x0077ff });
            let mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);
          });
        });

        if (object3D) scene.remove(object3D);
        object3D = group;
        scene.add(group);
        group.position.set(-50, -50, 0);
      };
      reader.readAsText(file);
    });

    document.getElementById('downloadSTL').addEventListener('click', () => {
      if (!object3D) return;
      let exporter = new THREE.STLExporter();
      let stl = exporter.parse(object3D);
      let blob = new Blob([stl], { type: 'application/vnd.ms-pki.stl' });
      let link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'stamp.stl';
      link.click();
    });

    document.getElementById('download3MF').addEventListener('click', () => {
      if (!object3D) return;
      let exporter = new THREE.ThreeMFExporter();
      let res = exporter.parse(object3D);
      let blob = new Blob([res], { type: 'model/3mf' });
      let link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'stamp.3mf';
      link.click();
    });

    camera.position.z = 200;

    function animate() {
      requestAnimationFrame(animate);
      if (object3D) object3D.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
